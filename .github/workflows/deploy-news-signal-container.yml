name: Deploy News Signal Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-news-signal-container.yml"
      - "deployment/cloudflare-news-signal-container/**"

concurrency:
  group: deploy-news-signal-container
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker and Container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    defaults:
      run:
        working-directory: deployment/cloudflare-news-signal-container

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deployment/cloudflare-news-signal-container/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test dashboard snapshot fallback
        shell: bash
        run: |
          npx wrangler dev --local --config wrangler.snapshot-test.jsonc --port 8791 \
            --var SNAPSHOT_UPLOAD_TOKEN:test-upload \
            --var OFFSITE_BACKUP_TOKEN:test-offsite \
            --var CONTAINER_API_TOKEN:test-dashboard \
            --var SELF_HOSTED_API_ORIGIN:https://127.0.0.1:1 \
            >/tmp/news-snapshot-wrangler.log 2>&1 &
          wrangler_pid=$!
          trap 'kill "${wrangler_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8791/health >/dev/null; then
              break
            fi
            if ! kill -0 "${wrangler_pid}" 2>/dev/null; then
              cat /tmp/news-snapshot-wrangler.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8791/health >/dev/null
          npm run check:snapshot

      - name: Confirm Docker is available
        run: docker version

      - name: Configure dashboard snapshot credential
        run: |
          printf '%s' "$SNAPSHOT_UPLOAD_TOKEN" | npx wrangler secret put SNAPSHOT_UPLOAD_TOKEN
          printf '%s' "$SELF_HOSTED_API_TOKEN" | npx wrangler secret put SELF_HOSTED_API_TOKEN
          printf '%s' "$OFFSITE_BACKUP_TOKEN" | npx wrangler secret put OFFSITE_BACKUP_TOKEN
        env:
          SNAPSHOT_UPLOAD_TOKEN: ${{ secrets.SNAPSHOT_UPLOAD_TOKEN }}
          SELF_HOSTED_API_TOKEN: ${{ secrets.SELF_HOSTED_API_TOKEN }}
          OFFSITE_BACKUP_TOKEN: ${{ secrets.OFFSITE_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker and Container
        run: npx wrangler deploy --containers-rollout=immediate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
