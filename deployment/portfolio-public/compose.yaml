name: cartdotcom-portfolio-public
services:
  origin:
    image: python:3.12-slim
    command: ["python3", "/app/serve.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    ports: ["172.19.0.1:3112:3112"]
    volumes:
      - ./serve.py:/app/serve.py:ro
      - ./data:/srv/cartdotcom/portfolio-public/data:ro
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
