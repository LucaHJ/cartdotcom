name: cartdotcom-instagram-reel-brain

x-reel-env: &reel-env
  NODE_ENV: production
  REEL_PHASE: "${REEL_PHASE:-phase1-inert}"
  REEL_PROCESSING_AUTHORITY: "${REEL_PROCESSING_AUTHORITY:-cloud}"
  REEL_INTAKE_ENABLED: "${REEL_INTAKE_ENABLED:-false}"
  REEL_DISPATCH_ENABLED: "${REEL_DISPATCH_ENABLED:-false}"
  REEL_WORKER_ENABLED: "${REEL_WORKER_ENABLED:-false}"
  REEL_CODEX_ENABLED: "${REEL_CODEX_ENABLED:-false}"
  REEL_OUTBOUND_ENABLED: "${REEL_OUTBOUND_ENABLED:-false}"
  REEL_MUTATIONS_ENABLED: "${REEL_MUTATIONS_ENABLED:-false}"
  REEL_BACKLOG_ENABLED: "${REEL_BACKLOG_ENABLED:-false}"
  REEL_PUBLISHER_ENABLED: "${REEL_PUBLISHER_ENABLED:-false}"
  REEL_ARCHIVER_ENABLED: "${REEL_ARCHIVER_ENABLED:-false}"
  REEL_AUTH_ROTATOR_ENABLED: "${REEL_AUTH_ROTATOR_ENABLED:-false}"
  REEL_WORKER_CONCURRENCY: "${REEL_WORKER_CONCURRENCY:-1}"

x-reel-service: &reel-service
  build:
    context: ./services/inert-health
  restart: unless-stopped
  environment:
    <<: *reel-env
  healthcheck:
    test: ["CMD", "node", "healthcheck.js"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 10s
  pids_limit: 128
  security_opt:
    - no-new-privileges:true

services:
  reel-api:
    <<: *reel-service
    environment:
      <<: *reel-env
      REEL_SERVICE_NAME: reel-api
      PORT: "3100"
    networks:
      - reel-runtime
    expose:
      - "3100"
    mem_limit: 256m
    cpus: 0.25

  reel-dispatcher:
    <<: *reel-service
    environment:
      <<: *reel-env
      REEL_SERVICE_NAME: reel-dispatcher
      PORT: "3101"
    networks:
      - reel-runtime
    expose:
      - "3101"
    mem_limit: 160m
    cpus: 0.15

  reel-worker:
    <<: *reel-service
    environment:
      <<: *reel-env
      REEL_SERVICE_NAME: reel-worker
      PORT: "3102"
    volumes:
      - type: bind
        source: ${REEL_RUNS_ROOT:-/srv/cartdotcom/reel-brain-runs}
        target: /runs
    networks:
      - reel-runtime
      - reel-egress
    expose:
      - "3102"
    mem_limit: 768m
    cpus: 0.80

  reel-publisher:
    <<: *reel-service
    environment:
      <<: *reel-env
      REEL_SERVICE_NAME: reel-publisher
      PORT: "3103"
    networks:
      - reel-runtime
    expose:
      - "3103"
    mem_limit: 160m
    cpus: 0.20

  reel-archiver:
    <<: *reel-service
    environment:
      <<: *reel-env
      REEL_SERVICE_NAME: reel-archiver
      PORT: "3104"
    volumes:
      - type: bind
        source: ${REEL_DATA_ROOT:-/srv/cartdotcom/reel-brain-data}
        target: /data
      - type: bind
        source: ${REEL_BACKUP_ROOT:-/srv/backups/instagram-reel-brain}
        target: /backups
    networks:
      - reel-runtime
    expose:
      - "3104"
    mem_limit: 160m
    cpus: 0.20

  reel-auth-rotator:
    <<: *reel-service
    environment:
      <<: *reel-env
      REEL_SERVICE_NAME: reel-auth-rotator
      PORT: "3105"
    networks:
      - reel-runtime
      - reel-egress
    expose:
      - "3105"
    mem_limit: 256m
    cpus: 0.25

  phase5-runner:
    profiles: ["phase5-runner"]
    build:
      context: .
      dockerfile: phase5-runner/Dockerfile
    restart: "no"
    environment:
      <<: *reel-env
      REEL_SERVICE_NAME: phase5-runner
      REEL_PHASE5_RUNNER_ENABLED: "${REEL_PHASE5_RUNNER_ENABLED:-false}"
      REEL_PHASE5_PROCESSOR_PATH: /opt/reel/processor/app.py
      REEL_PHASE5_PG_MODE: native
      REEL_PHASE5_PGHOST: cartdotcom-platform-postgres-1
      REEL_PHASE5_PGPORT: "5432"
      REEL_PHASE5_PGDATABASE: cartdotcom
      REEL_PHASE5_PGUSER: cartdotcom
      REEL_PHASE5_PG_PASSWORD_FILE: /run/secrets/postgres_password
      REEL_PHASE5_ADMIN_TOKEN_FILE: /run/secrets/phase5_admin_token
      CODEX_HOME: /home/node/.codex
      CODEX_AUTH_SOURCE: /codex-auth/auth.json
      CODEX_RESEARCH_MODEL: "${CODEX_RESEARCH_MODEL:-gpt-5.6-luna}"
      CODEX_RESEARCH_REASONING_EFFORT: "${CODEX_RESEARCH_REASONING_EFFORT:-medium}"
    volumes:
      - type: bind
        source: /home/lucaj/.codex/auth.json
        target: /codex-auth/auth.json
        read_only: true
      - type: bind
        source: /srv/platform/secrets/postgres_password
        target: /run/secrets/postgres_password
        read_only: true
      - type: bind
        source: ${REEL_RUNS_ROOT:-/srv/cartdotcom/reel-brain-runs}
        target: /runs
      - type: tmpfs
        target: /work
        tmpfs:
          mode: 511
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 511
      - type: tmpfs
        target: /home/node
        tmpfs:
          mode: 511
    networks:
      - reel-runtime
      - reel-egress
      - platform-data
    read_only: true
    mem_limit: 768m
    cpus: 0.15
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

networks:
  reel-runtime:
    name: cartdotcom-reel-runtime
    internal: true
  reel-egress:
    name: cartdotcom-reel-egress
  platform-data:
    name: cartdotcom-data
    external: true
