name: cartdotcom-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartdotcom
      POSTGRES_USER: cartdotcom
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartdotcom -d cartdotcom"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data
    mem_limit: 3g
    cpus: 3.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/docs:/srv/docs:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      edge:
        ipv4_address: 172.19.0.5
      data:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres_data:
    name: cartdotcom-postgres-data
  caddy_data:
    name: cartdotcom-caddy-data
  caddy_config:
    name: cartdotcom-caddy-config

networks:
  edge:
    name: cartdotcom-edge
  data:
    name: cartdotcom-data
    internal: true
