name: nba-curiosities
services:
  build:
    image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    user: "1000:1000"
    working_dir: /app
    volumes: ["./:/app"]
    network_mode: none
    cpus: 1
    mem_limit: 1400m
    pids_limit: 64
    restart: "no"
    command: ["python", "pipeline/build_snapshot.py", "--archive", "raw/box-scores.zip", "--output", "output"]
  discover:
    image: node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
    user: "1000:1000"
    working_dir: /app
    volumes: ["./:/app"]
    network_mode: none
    cpus: 1
    mem_limit: 512m
    pids_limit: 64
    restart: "no"
    command: ["node", "--experimental-default-type=module", "pipeline/discover.mjs", "output"]
